name: Unit tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Game rules and persistence
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "${latest}" ]; then sudo xcode-select -s "${latest}"; fi
          xcodebuild -version

      - name: Run unit tests
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b
          xcodebuild test \
            -project "Emerald Coast.xcodeproj" \
            -scheme "Emerald Coast" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -only-testing:"Emerald CoastTests" \
            CODE_SIGNING_ALLOWED=NO
