name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "${latest}" ]; then
            sudo xcode-select -s "${latest}"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Build app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project "Emerald Coast.xcodeproj" \
            -scheme "Emerald Coast" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      - name: Package Payload into an .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Emerald Coast.app"
          if [ ! -d "${APP}" ]; then
            echo "App bundle not found, looking for it:"
            find build/Build/Products -maxdepth 2 -name "*.app" -print
            exit 1
          fi
          rm -rf Payload CANNABIZ-unsigned.ipa
          mkdir Payload
          cp -R "${APP}" Payload/
          /usr/bin/zip -qry CANNABIZ-unsigned.ipa Payload
          rm -rf Payload
          ls -lh CANNABIZ-unsigned.ipa

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CANNABIZ-unsigned-ipa
          path: CANNABIZ-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling build (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          body: |
            Automatically built unsigned IPA from the latest commit on `main`.

            Install with Feather (or any sideloading tool) – it signs the IPA with your own certificate.
          prerelease: true
          files: CANNABIZ-unsigned.ipa

      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: CANNABIZ-unsigned.ipa
